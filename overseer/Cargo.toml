[package]
name    = "overseer"
version = "1.11.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "os"
path = "src/main.rs"

[dependencies]
chrono        = { version = "0.4", features = ["serde"] }          # Utilities
clap          = { version = "4.5", features = ["derive"] }         # CLI
clap_complete = "4.5"                                              # CLI
# JJ backend (jj-lib) [PRIMARY] - pin exact version due to API instability
jj-lib        = "=0.37"                                            # VCS backends
owo-colors    = { version = "4", features = ["supports-colors"] }  # Utilities
pollster      = "0.4"                                              # VCS backends
rusqlite      = { version = "0.38", features = ["bundled"] }       # Storage
serde         = { version = "1.0", features = ["derive"] }         # Serialization
serde_json    = "1.0"                                              # Serialization
thiserror     = "2.0"                                              # Utilities
ulid          = "1.2"                                              # Utilities

[dependencies.gix]  # Git backend (gix) [FALLBACK, but working I hope] - pure Rust git implementation
version          = "0.77"
default-features = false
features         = ["dirwalk", "index", "revision", "status", "worktree-mutation"]

[dev-dependencies]
tempfile = "3.24"

[profile.dev.package.gix]
opt-level = 1

[profile.dev.package.jj-lib]
opt-level = 1

[profile.release]
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
